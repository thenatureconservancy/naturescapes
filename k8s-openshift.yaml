apiVersion: v1
kind: Namespace
metadata:
  name: mapbox-vue-app

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapbox-vue-app
  namespace: mapbox-vue-app
  labels:
    app: mapbox-vue-app
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mapbox-vue-app
  template:
    metadata:
      labels:
        app: mapbox-vue-app
    spec:
      # Use default service account; OpenShift restricted-v2 SCC is applied by default
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: your-registry/mapbox-vue-app:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: MAPBOX_API_KEY
          valueFrom:
            secretKeyRef:
              name: mapbox-secrets
              key: api-key
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: mapbox-vue-app
  namespace: mapbox-vue-app
  labels:
    app: mapbox-vue-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: mapbox-vue-app

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mapbox-vue-app
  namespace: mapbox-vue-app
  labels:
    app: mapbox-vue-app
spec:
  to:
    kind: Service
    name: mapbox-vue-app
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
